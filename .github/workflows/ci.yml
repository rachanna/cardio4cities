name: CI

# Pull requests, and main after a merge: a push to a branch with an open pull request
# would otherwise run everything twice (BD-43)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs, with the tag in a comment (BD-36; code review RV-075)

jobs:
  changes:
    # Documentation-only changes skip the code jobs; they still get the secret scan and
    # the AT-02 city-name scan (docs-scan), since a document can leak either (BD-43)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0  # unknown base: run everything
          fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(docs/|deck/|samples/|README\.md$|CLAUDE\.md$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  docs-scan:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: month
        run: echo "value=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            reference/geonames/cities15000.zip
            reference/geonames/admin1CodesASCII.txt
            reference/geonames/countryInfo.txt
          key: geonames-${{ steps.month.outputs.value }}
      - run: uv run poe geonames
      - run: uv run pytest tests/acceptance/test_no_seeding.py -p no:randomly

  lint-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: c4c
          POSTGRES_PASSWORD: c4c
          POSTGRES_DB: c4c
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U c4c -d c4c"
          --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s --health-timeout 3s --health-retries 20
      neo4j:
        image: neo4j:5.26.31-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
          NEO4J_server_memory_heap_max__size: 1G
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30 --health-start-period 20s
    env:
      TEST_DATABASE_URL: postgresql://c4c:c4c@127.0.0.1:5432/c4c_test
      TEST_QDRANT_URL: http://127.0.0.1:6333
      TEST_NEO4J_URI: bolt://127.0.0.1:7687
      TEST_NEO4J_PASSWORD: ci-neo4j-password  # throwaway CI container, not a secret
      C4C_REQUIRE_DB: "1"  # store tests fail instead of skipping
      C4C_REQUIRE_WEB: "1"  # the browser smoke test fails instead of skipping (BD-41)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: month
        run: echo "value=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            reference/geonames/cities15000.zip
            reference/geonames/admin1CodesASCII.txt
            reference/geonames/countryInfo.txt
          key: geonames-${{ steps.month.outputs.value }}
      - run: uv run poe geonames  # gazetteer for the AT-02 scan; no-op when cached
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22.20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv run poe web
      - run: npm run typecheck
        working-directory: web
      - name: API types match the API (run `uv run poe types` and commit when this fails)
        run: uv run poe types && git diff --exit-code web/lib/api-types.ts
      - run: uv run playwright install --with-deps chromium
      - run: uv run poe lint
      - run: uv run poe test

  secrets:
    # The same scanner as the local pre-commit hook (docs/GIT.md §5), over the whole history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # on a pull request the action lists its commits (BD-39)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1  # as .pre-commit-config.yaml
          GITLEAKS_ENABLE_COMMENTS: "false"  # read-only token: report in the job log only

  image:
    # Build only, never pushed or deployed (auto-deploy stays off, R-91)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: docker build --pull -t cardio4cities:ci .
