    relation: {type: PARTNERS_WITH, subject: hospital, object: hbho, valid_from: 2025-01-01}
  - id: clm_rag_ngo_funds
    slot: S14
    source: src_rag_ngo
    period: 2025
    statement: The Norvania Heart Foundation funds the Halden Bay HEARTS hypertension programme.
    quote: the Norvania Heart Foundation funds the Halden Bay HEARTS hypertension programme
    relation: {type: FUNDS, subject: nhf, object: hearts, valid_from: 2025-01-01}
  - id: clm_rag_ngo_partner
    slot: S14
    source: src_rag_ngo
    period: 2025
    statement: The Norvania Heart Foundation partners with the Halden Bay Health Office on screening days.
    quote: the Norvania Heart Foundation partners with the Halden Bay Health Office on screening days
    relation: {type: PARTNERS_WITH, subject: nhf, object: hbho, valid_from: 2025-01-01}

  # --- D6 data ---------------------------------------------------------------------------------
  - id: clm_rag_bulletin
    slot: S15
    source: src_rag_office
    period: 2025
