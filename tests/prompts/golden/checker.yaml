# Checker golden set (LLD-3 §9, BD-10): claim and passage pairs with the expected final
# label (after the PD-03 rule). Fictional places only (Halden Bay, Kestrel Point, Port
# Ostra, Norvania). `labels` gives the labels the claim carries; unlisted labels are not
# stated. `label_passages` are passages located elsewhere in the same source.

- id: exact-support
  statement: In Halden Bay, 18.4% of adults aged 30-79 with hypertension had it controlled in 2024.
  value: "18.4%"
  labels: {geography_level: city_wide, geography_name: Halden Bay, measure_type: cascade_control,
           period: "2024", age_min: 30, age_max: 79, group: adults with hypertension,
           denominator: adults with hypertension}
  passage: |
    Among adults aged 30-79 in Halden Bay who had hypertension, 18.4% had their blood
    pressure controlled (below 140/90 mmHg) in the 2024 household survey.
  expected: supported

- id: number-differs
  statement: In Halden Bay, 21.4% of adults with hypertension had it controlled in 2024.
  value: "21.4%"
  labels: {geography_level: city_wide, geography_name: Halden Bay, measure_type: cascade_control,
           period: "2024"}
  passage: |
    Among adults in Halden Bay who had hypertension, 18.4% had their blood pressure
    controlled in the 2024 household survey.
  expected: refuted

- id: national-labelled-as-city
  statement: In Halden Bay, 24.1% of adults with hypertension have it under control.
  value: "24.1%"
  labels: {geography_level: city_wide, geography_name: Halden Bay, measure_type: cascade_control}
  passage: |
    HALDEN BAY HERALD - The national health survey shows that 24.1% of adults in Norvania
    with hypertension have it under control.
  expected: refuted

- id: national-labelled-correctly
  statement: In Norvania, 24.1% of adults with hypertension have it under control.
  value: "24.1%"
  labels: {geography_level: national, geography_name: Norvania, measure_type: cascade_control}
  passage: |
    HALDEN BAY HERALD - The national health survey shows that 24.1% of adults in Norvania
    with hypertension have it under control.
  expected: supported

- id: screening-as-prevalence
  statement: Hypertension prevalence in Halden Bay was 22.7% in 2025.
  value: "22.7%"
  labels: {geography_level: city_wide, geography_name: Halden Bay,
           measure_type: measured_prevalence, period: "2025"}
  passage: |
    During the March 2025 health camps in Halden Bay, 12,480 residents were screened and
    22.7% of people screened had high blood pressure readings.
  expected: refuted

- id: confident-wording-no-figure
  statement: Halden Bay has a hypertension control rate of 40%.
  value: "40%"
  labels: {geography_level: city_wide, geography_name: Halden Bay, measure_type: cascade_control}
  passage: |
    Everyone agrees that Halden Bay has the best hypertension control in Norvania, and the
    mayor is proud of the city's clinics.
  expected: insufficient

- id: period-in-label-passage
  statement: In Halden Bay, 29.3% of adults aged 18 and over had hypertension in 2024.
  value: "29.3%"
  labels: {geography_level: city_wide, geography_name: Halden Bay,
           measure_type: measured_prevalence, period: "2024", age_min: 18}
  passage: |
    Results. Hypertension was found in 29.3% of adults aged 18 and over.
  label_passages:
    period: |
      Data collection took place between January and June 2024 in all wards of Halden
      Bay, using measured blood pressure on three readings.
  expected: supported

- id: period-missing-everywhere
  statement: In Halden Bay, 29.3% of adults had hypertension in 2024.
  value: "29.3%"
  labels: {geography_level: city_wide, geography_name: Halden Bay,
           measure_type: measured_prevalence, period: "2024"}
  passage: |
    Results. Hypertension was found in 29.3% of adults in Halden Bay.
