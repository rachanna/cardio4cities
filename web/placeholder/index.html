<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CARDIO4Cities research assistant</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #5c5c57; --accent: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ececea; --muted: #a3a39e; --accent: #f2b8b5; } }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 36rem; margin: 18vh auto 0; padding: 0 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: .25rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>CARDIO4Cities <span>City Lead</span> research assistant</h1>
    <p>Live, verified, cited briefs of a city's cardiovascular landscape.</p>
    <p>The application is being set up. Service status: <a href="/api/v1/health">/api/v1/health</a></p>
  </main>
</body>
</html>
