[project]
name = "cardio4cities"
version = "0.1.0"
description = "Live, verified, cited briefs of a city's cardiovascular landscape for CARDIO4Cities City Leads"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.2",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "qdrant-client>=1.19.1",
    "neo4j>=5.26,<6",
    "protego>=0.7.0",
    "trafilatura>=2.3.0",
    "pdfplumber>=0.11.10",
    "openai>=3.24.0",
    "python-ulid>=4.0.1",
    "anthropic>=1.11.0",
    "langgraph>=1.2.12",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx2>=2.13.1",
    "import-linter",
    "mypy",
    "poethepoet",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "trustme>=1.2.1",
    "types-pyyaml",
]
local-embeddings = [
    "sentence-transformers>=6.1.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Tasks (BD-01): run as `uv run poe <task>`. Each task is added by the build
# task that makes it work; see REPO_STRUCTURE §4.
# ---------------------------------------------------------------------------
[tool.poe.tasks]
up = { cmd = "docker compose up -d --wait", help = "Start local stores and SearXNG" }
down = { cmd = "docker compose down", help = "Stop local stores and SearXNG" }
fmt = { sequence = ["ruff format .", "ruff check --fix ."], default_item_type = "cmd", help = "Format and auto-fix" }
lint = { sequence = [
    "ruff check .",
    "ruff format --check .",
    "mypy",
    "lint-imports",
], default_item_type = "cmd", help = "ruff, mypy, import-linter" }
test = { cmd = "pytest", help = "Unit, contract, architecture and acceptance tests (recorded responses)" }
smoke = { cmd = "pytest tests/smoke -p no:cacheprovider --smoke-url ${url}", args = [
    { name = "url", positional = true, required = true, help = "Deployed base URL" },
], help = "Smoke tests against a deployed URL (AT-29 partial)" }
spike = { cmd = "python -m scripts.spikes.${name}", args = [
    { name = "name", positional = true, required = true, help = "Spike script in scripts/spikes/" },
], help = "Run one day-1 spike (may make live calls: ask the owner first)" }
eval = { cmd = "python -m scripts.eval_prompts", help = "Prompt golden set against real models (costs money: ask first)" }
migrate = { cmd = "alembic upgrade head", help = "Run database migrations (needs DATABASE_URL only)" }
geonames = { cmd = "python -m scripts.reference.load_geonames --download-only", help = "Download GeoNames dumps if missing" }
reference = { sequence = [
    "python -m scripts.reference.load_geonames",
    "python -m scripts.reference.load_yaml_reference",
], default_item_type = "cmd", help = "Load gazetteer and reference YAML (needs DATABASE_URL only)" }

# ---------------------------------------------------------------------------
# Migrations (LLD-1 §4): hand-written, NNNN_<summary>.py, autogenerate off.
# env.py reads DATABASE_URL only.
# ---------------------------------------------------------------------------
[tool.alembic]
script_location = "app/adapters/postgres/migrations"
prepend_sys_path = ["."]
file_template = "%%(rev)s_%%(slug)s"

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# SQL copied verbatim from LLD-1 §4
"app/adapters/postgres/migrations/versions/*" = ["E501"]
# Only table and column names from module constants are interpolated; values go through COPY
"app/adapters/postgres/repos/reference.py" = ["S608"]
# These modules exist to map typographic quotes, dashes and spaces (LLD-2 §4.1, §4.2)
"app/workflow/rules/{quotes,numbers}.py" = ["RUF001"]
"tests/unit/test_{quote_match,numbers}.py" = ["RUF001"]
"tests/contract/test_sources_snapshots.py" = ["RUF001"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "scripts", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.workflow.rules.*"]
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# no type stubs ship with lxml (parser adapter, BD-10)
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# optional dependency group (local-embeddings): absent in CI and the image
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "db: needs PostgreSQL (TEST_DATABASE_URL); skipped locally if unreachable",
    "stores: needs Qdrant and Neo4j (TEST_QDRANT_URL, TEST_NEO4J_URI); skipped locally if unreachable",
]

# ---------------------------------------------------------------------------
# Dependency rules, REPO_STRUCTURE §3 (AT-34).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core layers"
type = "layers"
layers = [
    "app.api",
    "app.workflow | app.query | app.report",
    "app.prompts | app.ports",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Core never imports adapters or the composition root"
type = "forbidden"
source_modules = [
    "app.api",
    "app.workflow",
    "app.query",
    "app.report",
    "app.prompts",
    "app.ports",
    "app.domain",
]
forbidden_modules = ["app.adapters", "app.container", "app.main"]

[[tool.importlinter.contracts]]
name = "Adapters depend only on ports and domain"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = [
    "app.api",
    "app.workflow",
    "app.query",
    "app.report",
    "app.prompts",
    "app.container",
    "app.main",
]

[[tool.importlinter.contracts]]
name = "Vendor SDKs only in adapters"
type = "forbidden"
source_modules = [
    "app.api",
    "app.workflow",
    "app.query",
    "app.report",
    "app.prompts",
    "app.ports",
    "app.domain",
]
forbidden_modules = [
    "anthropic",
    "openai",
    "ollama",
    "sentence_transformers",
    "qdrant_client",
    "graphiti_core",
    "neo4j",
    "httpx",
    "httpx2",
    "httpcore",
    "httpcore2",
    "protego",
    "trafilatura",
    "lxml",
    "pdfplumber",
    "weasyprint",
    "langsmith",
    "opentelemetry",
    "asyncpg",
    "sqlalchemy",
    "alembic",
]
