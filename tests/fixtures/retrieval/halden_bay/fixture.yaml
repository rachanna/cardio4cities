contested:
  - [clm_rag_prev_a, clm_rag_prev_b]

slot_results:
  S01: {status: answered, best: [clm_rag_gov_new]}
  S02: {status: answered, best: [clm_rag_reorg]}
  S03: {status: answered, best: [clm_rag_prev_a, clm_rag_prev_b], flags: [conflicting]}
  S04: {status: answered_wider_geo, best: [clm_rag_control_national],
        gap_note: "No city-level figure found. Best available is national (Norvania, 2021)."}
  S05: {status: answered, best: [clm_rag_diabetes_old], flags: [stale]}
  S06: {status: answered, best: [clm_rag_stroke]}
  S07: {status: answered, best: [clm_rag_runs_hearts]}
  S08: {status: answered, best: [clm_rag_screening]}
  S09: {status: answered, best: [clm_rag_plan_target]}
  S10: {status: answered, best: [clm_rag_protocol]}
  S11: {status: answered_negative, best: [],
        gap_note: "Searched 6 queries in English and checked 5 sources; nothing acceptable found for this question."}
  S12: {status: answered_negative, best: [],
