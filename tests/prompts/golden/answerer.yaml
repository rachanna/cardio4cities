       status: contested, contested_with: clm_g04,
       statement: "In Halden Bay, 31.2% of adults had hypertension in 2024.",
       quote: "Hypertension affected 31.2% of adults in Halden Bay"}
    - {ref: clm_g04, slot: S03, value: "27.5%", level: city_wide, geography: Halden Bay, period: 2024,
       status: contested, contested_with: clm_g03,
       statement: "In Halden Bay, 27.5% of adults had hypertension in 2024.",
       quote: "27.5% of adults in Halden Bay were living with hypertension"}
  expect: disagree
  cites: [clm_g03, clm_g04]

