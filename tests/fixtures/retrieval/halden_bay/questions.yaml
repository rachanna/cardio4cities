# Retrieval evaluation questions (LLD-5 §12.1, D3-2b, BD-39) on the Halden Bay fixture.
# `classified`: the classifier output used in CI (real models classify for themselves in
# `poe eval-rag`). `gold`: claims that must be in the bundle. `expect`: answer, abstain,
# disagree (both sides of a pair stated) or wider_area. `means`: in CI the question embeds
# as this claim's index text, standing in for a question worded unlike any claim (AT-43).
# `follows`: the question this one follows up, in the same conversation.

- id: q01-prevalence
  question: What share of adults in Halden Bay have hypertension?
  classified: {question_type: figure, slot_ids: [S03], indicator_codes: [HTN_PREV]}
  gold: [clm_rag_prev_a, clm_rag_prev_b]
  expect: disagree

- id: q02-control
  question: How many people with hypertension in Halden Bay have it under control?
  classified: {question_type: figure, slot_ids: [S04], indicator_codes: [HTN_CONTROL]}
  gold: [clm_rag_control_national]
  expect: wider_area

- id: q03-diabetes
  question: What is the diabetes prevalence in Halden Bay?
  classified: {question_type: figure, slot_ids: [S05], indicator_codes: [DM_PREV]}
  gold: [clm_rag_diabetes_old]
  expect: answer

- id: q04-stroke
  question: What is the stroke mortality rate in Halden Bay?
  classified: {question_type: figure, slot_ids: [S06], indicator_codes: [STROKE_MORT]}
  gold: [clm_rag_stroke]
  expect: answer

- id: q05-who-runs
