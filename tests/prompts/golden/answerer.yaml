# Answerer golden set (LLD-3 §9, BD-38): fictional bundles about Halden Bay, Norvania.
# The answer is put through the real post-check, then graded on what survives.
# `expect`: answer (a fact sentence cites one of `cites`), abstain (no fact sentence, an
# abstention), disagree (both sides of the pair cited), wider_area (the wider figure cited
# with no post-check removal), abstain_or_mention (no fact sentence; a mention says it is
# unconfirmed). `forbid`: text that must not appear. Facts: `level` and `period` (a year)
# become the claim's labels; `status` is supported unless given.

- id: city-figure
  question: How many people with hypertension in Halden Bay have it under control?
  asked: [S04]
  facts:
    - {ref: clm_g01, slot: S04, value: "18.4%", level: city_wide, geography: Halden Bay, period: 2024,
       statement: "In Halden Bay, 18.4% of adults aged 30-79 with hypertension had it controlled in 2024.",
       quote: "18.4% of adults aged 30-79 with hypertension had their blood pressure controlled"}
  expect: answer
  cites: [clm_g01]

- id: national-only
  question: What is the hypertension control rate in Halden Bay?
  asked: [S04]
  facts:
    - {ref: clm_g02, slot: S04, value: "24.1%", level: national, geography: Norvania, period: 2021,
       statement: "In Norvania, 24.1% of adults with hypertension had it under control in 2021.",
       quote: "24.1% of adults in Norvania with hypertension have it under control"}
  wider: {S04: "No city-level figure found. Best available is national (Norvania, 2021)."}
  expect: wider_area
  cites: [clm_g02]

- id: sources-disagree
