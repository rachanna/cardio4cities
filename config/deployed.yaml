# Deployed configuration (LLD-4 §5.1). Secrets come only from environment
# variables named by the *_env keys. Start-up refuses "<confirm day 1>" and
# zero budgets here (LLD-4 §5.2).
app:
  public_base_url: https://c4c-app.onrender.com   # confirmed after the Render service exists (BD-04)
  user_agent: "CARDIO4CitiesResearchBot/0.1 (+https://github.com/rachanna/cardio4cities)"
access:
  access_code_env: ACCESS_CODE
  admin_code_env: ADMIN_CODE
  session_secret_env: SESSION_SECRET
llm:
  # Model bindings (BD-05). Each binding carries the setting its model accepts:
  # effort for Claude Sonnet/Opus 5.5 and OpenAI reasoning models, temperature for Claude Haiku 4.5.
  roles:
    planner:    { provider: anthropic, model: claude-sonnet-5-5, family: anthropic, effort: medium }
    extractor:  { provider: anthropic, model: claude-haiku-4-5-20251001, family: anthropic, temperature: 0,
                  escalate_to: { provider: anthropic, model: claude-sonnet-5-5, effort: low } }
    # Provisional (BD-05): golden-set agreement met (100%, BD-10); spike S-6 still to pass.
    # Was: gpt-6.1-sol on low effort must reach >= 90% golden-set agreement
    # (LLD-3 §9) and pass spike S-6; otherwise step up to gpt-6-astra and raise the cost cap to $15.
    checker:    { provider: openai, model: gpt-6.1-sol, family: openai, effort: low,
                  fallback: { provider: anthropic, model: claude-opus-5-5, family: anthropic, effort: high } }
    classifier: { provider: anthropic, model: claude-haiku-4-5-20251001, family: anthropic, temperature: 0 }
    answerer:   { provider: anthropic, model: claude-sonnet-5-5, family: anthropic, effort: low }
    reporter:   { provider: anthropic, model: claude-sonnet-5-5, family: anthropic, effort: low }
  providers:
    anthropic: { api_key_env: ANTHROPIC_API_KEY }
    openai:    { api_key_env: OPENAI_API_KEY }
    ollama:    { base_url_env: OLLAMA_BASE_URL }   # required only when a role uses it
  concurrency: 4
  allow_same_family_checker: false   # BD-02; when true it is shown on every verdict and in /health
embeddings: { provider: openai, model: text-embedding-3-small, dimension: 1536, key: openai_small_v1, concurrency: 4 }
search:     { provider: brave, mode: links_only, api_key_env: BRAVE_API_KEY, rate_per_s: 5 }   # BD-15: Brave allows 50 a second (S-4)
relational: { dsn_env: DATABASE_URL }
vector:     { provider: qdrant, url_env: QDRANT_URL, api_key_env: QDRANT_API_KEY }
graph:      { provider: graphiti_neo4j, uri_env: NEO4J_URI, user_env: NEO4J_USER, password_env: NEO4J_PASSWORD }
snapshots:  { provider: postgres, max_bytes: 10485760 }
renderer:   { provider: weasyprint }
tracing:    { providers: [events, langsmith], langsmith_api_key_env: LANGSMITH_API_KEY }
# Provisional until spike S-6 (BD-05): estimate ~1.4M tokens, ~$4.10 a run with gpt-6.1-sol low
budget:     { wall_clock_s: 420, searches: 64, fetches: 60, tokens: 1500000, cost_micro_usd: 3000000, wind_down_at: 0.85 }   # BD-15
limits:     { runs_per_day: 20, ask_per_min: 20, resolve_per_min: 30 }
fetch:      { concurrency: 6, min_interval_s: 1, max_bytes: 10485760, connect_timeout_s: 5, read_timeout_s: 20, allowed_ports: [80, 443], robots_timeout_s: 15 }
verify:     { max_claims_per_slot: 5, label_margin_chars: 200 }   # BD-05, BD-10
select:     { max_new_urls_per_slot_round: 3, max_reused_per_slot_round: 2, other_place_min_population: 15000 }   # BD-14, BD-15
replan:     { max_rounds: 2, max_rounds_wider_geo: 1, priority: [S04, S03, S05, S06] }   # priority: BD-15
plan:       { queries_per_slot: 2 }   # BD-15
extract:    { window_tokens: 12000, overlap_tokens: 500 }
quote:      { min_words: 6, max_words: 60, min_words_unique: 3 }   # LLD-2 §4.1 [tunable] (BD-06, BD-08)
chunk:      { prose_tokens: 400, overlap_tokens: 60, table_max_tokens: 1200 }   # LLD-1 §5.3 [tunable] (BD-07)
consistency: { agree_pp: 0.5, agree_rel: 0.02 }
entity:     { merge_threshold: 0.92, candidate_threshold: 0.85 }
badge:      { stale_years: 5, stale_years_people: 2, small_sample: 300 }
confidence: { recent_years: 5 }
analytics:  { enabled: false }
stream:     { poll_interval_s: 0.5, heartbeat_s: 15 }   # LLD-4 §4 [tunable]
# Official APIs for Wave 0 (LLD-2 §13, BD-13): reached through the collector's API path
structured:
  providers:
    who_gho:    { base_url: https://ghoapi.azureedge.net/api }
    world_bank: { base_url: https://api.worldbank.org/v2 }
eval:       { checker_agreement_min: 0.9 }   # LLD-3 §9 golden-set pass bar
geography:  { nearby_km: 75 }   # figures from places this close may answer for the city (BD-10)
