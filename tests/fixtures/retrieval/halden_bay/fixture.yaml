    statement: The Norvania NCD Action Plan 2023-2030 sets a 25% relative reduction in premature NCD deaths.
    quote: the Norvania NCD Action Plan 2023-2030 sets a 25% relative reduction in premature NCD deaths
  - id: clm_rag_plan_issued
    slot: S09
    source: src_rag_ministry
    period: 2023
