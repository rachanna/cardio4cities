# Local profile (LLD-4 §5.1, BD-05): the stores from docker-compose.yml, SearXNG for
# search, and low-cost models (~$1.40 a run). Secrets come only from environment
# variables named by the *_env keys. Placeholders are allowed here but refused in deployed.
# APP_ENV=local-quality runs the same setup with the deployed model bindings.
app:
  public_base_url: http://localhost:8000
  user_agent: "CARDIO4CitiesResearchBot/0.1 (+https://github.com/rachanna/cardio4cities)"
access:
  access_code_env: ACCESS_CODE
  admin_code_env: ADMIN_CODE
  session_secret_env: SESSION_SECRET
llm:
  # Model bindings (BD-05): Claude Haiku 4.5 takes temperature (the LLD-3 values), not effort.
  roles:
    planner:    { provider: anthropic, model: claude-haiku-4-5-20251001, family: anthropic, temperature: 0.3 }
    # No escalation locally, to cap cost.
    extractor:  { provider: anthropic, model: claude-haiku-4-5-20251001, family: anthropic, temperature: 0 }
    checker:    { provider: openai, model: gpt-6-luna, family: openai, effort: low,
                  fallback: { provider: anthropic, model: claude-opus-5-5, family: anthropic, effort: high } }
    # Offline alternative for wiring tests only (no cost). A 3B model is too weak to judge
    # quality; set OLLAMA_BASE_URL in .env (this laptop: http://127.0.0.1:11434).
    # checker:  { provider: ollama, model: "qwen2.5:3b", family: qwen,
    #             fallback: { provider: anthropic, model: claude-opus-5-5, family: anthropic, effort: high } }
    classifier: { provider: anthropic, model: claude-haiku-4-5-20251001, family: anthropic, temperature: 0 }
    answerer:   { provider: anthropic, model: claude-haiku-4-5-20251001, family: anthropic, temperature: 0.2 }
    reporter:   { provider: anthropic, model: claude-haiku-4-5-20251001, family: anthropic, temperature: 0.3 }
  providers:
    anthropic: { api_key_env: ANTHROPIC_API_KEY }
    openai:    { api_key_env: OPENAI_API_KEY }
    ollama:    { base_url_env: OLLAMA_BASE_URL }   # required only when a role uses it
  concurrency: 4
  allow_same_family_checker: false   # BD-02; when true it is shown on every verdict and in /health
# Multilingual: sources and quotes stay in their original language. Own Qdrant collection by key.
embeddings: { provider: sentence_transformers, model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2, dimension: 384, key: st_multiling_minilm_v1 }
search:     { provider: searxng, mode: links_only, base_url: http://127.0.0.1:8888, rate_per_s: 1 }   # base_url: BD-02
relational: { dsn_env: DATABASE_URL }
vector:     { provider: qdrant, url_env: QDRANT_URL }   # no API key locally
graph:      { provider: graphiti_neo4j, uri_env: NEO4J_URI, user_env: NEO4J_USER, password_env: NEO4J_PASSWORD }
snapshots:  { provider: postgres, max_bytes: 10485760 }
renderer:   { provider: weasyprint }
tracing:    { providers: [events] }
# Estimate ~$1.40 a run (BD-05)
budget:     { wall_clock_s: 300, searches: 48, fetches: 60, tokens: 2000000, cost_micro_usd: 2500000, wind_down_at: 0.85 }
limits:     { runs_per_day: 20, ask_per_min: 20, resolve_per_min: 30 }
fetch:      { concurrency: 6, min_interval_s: 1, max_bytes: 10485760, connect_timeout_s: 5, read_timeout_s: 20, allowed_ports: [80, 443], robots_timeout_s: 5 }
verify:     { max_claims_per_slot: 3 }   # fewer checker calls locally (BD-05)
select:     { max_new_urls_per_slot_round: 4 }
replan:     { max_rounds: 2, max_rounds_wider_geo: 1 }
extract:    { window_tokens: 12000, overlap_tokens: 500 }
quote:      { min_words: 6, max_words: 60 }   # LLD-2 §4.1 [tunable] (BD-06)
chunk:      { prose_tokens: 400, overlap_tokens: 60, table_max_tokens: 1200 }   # LLD-1 §5.3 [tunable] (BD-07)
consistency: { agree_pp: 0.5, agree_rel: 0.02 }
entity:     { merge_threshold: 0.92, candidate_threshold: 0.85 }
badge:      { stale_years: 5, stale_years_people: 2, small_sample: 300 }
confidence: { recent_years: 5 }
analytics:  { enabled: false }
